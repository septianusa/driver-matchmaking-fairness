comparison:
  enabled: true

  data_mode: actual

  lambda_driver_score_values:
    - 0.0
    - 0.1
    - 0.2
    - 0.3

  matching_algorithms:
    - hungarian
    - greedy
    - auction

  sparse_methods:
    - bfs_h3
    - a2gat

  repeats: 3
  warmup_runs: 1

  random_seed: 42

  measure_memory: true
  measure_cpu: true

  output_directory: outputs/comparison

matching:
  auction:
    enabled: true
    epsilon: 0.001
    max_iterations: 1000000

sparse:
  a2gat:
    anchor_hops: 4
    anchor_top_k: 8
    candidate_driver_target: 30
    distance_weight: 1.0
    driver_score_weight: 0.15

data:
  mode: actual

  actual:
    orders_path: data/raw/orders.csv
    driver_locations_path: data/raw/driver_locations.csv
    driver_scores_path: data/raw/driver_scores.csv
    grid_values_path: null
