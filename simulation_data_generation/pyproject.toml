[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simulation-data-generation"
version = "0.1.0"
description = "Surabaya ride-hailing dispatch simulation data generator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Research Simulation Project" }]
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "pyarrow>=15.0",
  "faker>=25.0",
  "h3>=4.1",
  "shapely>=2.0",
  "networkx>=3.2",
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "matplotlib>=3.8",
  "tqdm>=4.66"
]

[project.optional-dependencies]
osm = ["osmnx>=1.9", "geopandas>=0.14"]
viz = ["contextily>=1.7", "xyzservices>=2026.3"]
test = ["pytest>=8.0"]

[project.scripts]
generate-dispatch-data = "simulation_data_generation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --basetemp=.pytest_tmp"
